# Orbis on a server that stays on (docs/server.md, ADR 0026): the hub, and Caddy in front of it for HTTPS.
#
#   cd deploy
#   cp .env.example .env                              # then fill it in (never commit .env)
#   docker compose up -d --build                      # the hub on this machine only (127.0.0.1:7420)
#   docker compose --profile https up -d --build      # + Caddy: https://$ORBIS_DOMAIN with a free certificate
#
# scripts/server/orbis-server.sh does all of it on a fresh Ubuntu server. Only Caddy faces the internet
# (ports 80 and 443); the hub's own port stays on this machine.
services:
  orbis:
    build:
      context: ..
      dockerfile: Dockerfile
    image: orbis:local
    restart: unless-stopped
    environment:
      # The hub's token (also the recovery key when an account signs in). Empty: one is made in /data/token.
      ORBIS_TOKEN: ${ORBIS_TOKEN:-}
      # The token `claude setup-token` prints: Claude Code runs on your Claude plan, not the API.
      # Empty: paste it later in Settings → Brains → Claude Code.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # https://$ORBIS_DOMAIN when Caddy serves it: the hub then trusts Caddy for the visitor's address.
      ORBIS_PUBLIC_URL: ${ORBIS_PUBLIC_URL:-}
      # Your Orbis account's email: the hub then opens with that account's sign-in, with no token to copy.
      ORBIS_OWNER_EMAIL: ${ORBIS_OWNER_EMAIL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - orbis-data:/data
    # Only this machine reaches the port; from elsewhere, through Caddy.
    ports:
      - "127.0.0.1:${ORBIS_PORT:-7420}:7420"

  caddy:
    profiles: ["https"]
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - orbis
    environment:
      # The address Orbis is opened at, such as 203-0-113-7.sslip.io or orbis.example.com.
      ORBIS_DOMAIN: ${ORBIS_DOMAIN:-}
      ORBIS_SUPABASE_URL: ${ORBIS_SUPABASE_URL:-https://tqjxkgxmnkypzbpirztw.supabase.co}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  orbis-data:
  caddy-data:
  caddy-config:
