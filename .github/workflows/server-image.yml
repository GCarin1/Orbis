# Builds and publishes the Orbis server image (docs/server.md, docs/umbrel.md, ADR 0027) as
# ghcr.io/<owner>/orbis:latest (and :sha-<commit>). A home server (UmbrelOS through Portainer) or a VM pulls it
# ready, with nothing to compile on a small machine. Runs on a push that changes the image's contents, and by
# hand (Actions → "Server image" → Run workflow).
#
# linux/amd64 is built natively on the runner. linux/arm64 (an Ampere VM, a Raspberry Pi) is emulated and much
# slower: tick "arm64" when running the workflow by hand to add it (change 0072).
#
# The first publish makes a private package: GitHub → your profile → Packages → orbis → Package settings →
# Change visibility → Public, so a server pulls it without signing in. It holds no secret.
name: Server image

on:
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (emulated, slower)"
        type: boolean
        default: false
  push:
    branches: ["main", "claude/**"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "packages/shared/**"
      - "packages/hub/**"
      - "packages/cli/**"
      - "packages/web/**"
      - "deploy/**"
      - ".github/workflows/server-image.yml"

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # the image in this repository's owner's GitHub Packages; nothing else is written

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: inputs.arm64
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orbis" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Orbis hub: the bots, the web app, Claude Code and Chromium
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the server script
        run: bash -n scripts/server/orbis-server.sh
