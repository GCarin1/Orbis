// The app's version follows Orbis's (the root package.json); CI adds the build number and the commit.
import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def orbisVersion = new JsonSlurper().parse(rootProject.file("../../package.json")).version
def buildNumber = (findProperty("orbisBuildNumber") ?: "1").toString().toInteger()
def versionSuffix = (findProperty("orbisVersionSuffix") ?: "").toString()
// The repository the install command for Termux downloads from (CI passes its own, a fork's included).
def orbisRepo = (findProperty("orbisRepo") ?: System.getenv("GITHUB_REPOSITORY") ?: "GCarin1/Orbis").toString()

// A release key from the environment (CI secrets); without one the APK is signed with the debug key,
// which installs fine but cannot update an install signed by another machine's key.
def keystorePath = System.getenv("ORBIS_ANDROID_KEYSTORE")
def hasReleaseKey = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace "app.orbis.android"
    compileSdk 36

    defaultConfig {
        applicationId "app.orbis.android"
        // Health Connect needs Android 8.0 (API 26).
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "${orbisVersion}${versionSuffix}"
        buildConfigField "String", "ORBIS_REPO", "\"${orbisRepo}\""
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ORBIS_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ORBIS_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ORBIS_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Google Play's code scanner: reads the computer's QR code with its own camera screen, so the app asks
    // for no camera permission (ADR 0014).
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    // The user's health data, read only (specs/health): Google Fit, Zepp (Amazfit), Samsung Health, Fitbit.
    implementation "androidx.health.connect:connect-client:1.1.0"
    // Its calls are coroutines; the app runs them off the main thread.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    testImplementation "junit:junit:4.13.2"
}
