<!doctype html>
<!-- The Android app's first screen (specs/android-app, ADR 0018): Orbis on this phone (started inside Termux,
     no computer, no sign-in), or the address of another Orbis (a computer, a server). -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orbis</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #131a30;
        --border: #26304d;
        --text: #eef1f8;
        --muted: #8ea0c8;
        --blue: #3b82f6;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 18px;
        background: radial-gradient(circle at 30% 20%, #16224a 0%, var(--bg) 60%);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: min(420px, 100%); display: flex; flex-direction: column; gap: 16px; }
      header { text-align: center; }
      header img { width: 84px; height: 84px; }
      h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: 0.5px; }
      .tagline { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
      form { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
      label { font-weight: 600; font-size: 14px; }
      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
      }
      input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
      button {
        padding: 13px;
        border: 0;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
      .error { margin: 0; color: var(--danger); font-size: 14px; overflow-wrap: anywhere; }
      .help { color: var(--muted); font-size: 13.5px; margin: 0; }
      .help ol { margin: 6px 0 0; padding-left: 20px; }
      .help li { margin: 4px 0; }
      code { background: #1c2542; padding: 1px 5px; border-radius: 6px; font-size: 12.5px; }
      .version { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; min-width: 0; }
      .secondary { background: #1c2542; color: var(--text); font-weight: 500; padding: 13px 14px; }
      .optional { color: var(--muted); font-weight: 400; }
      .recent { display: flex; flex-wrap: wrap; gap: 6px; }
      .recent button { background: #1c2542; color: var(--text); font-size: 13px; font-weight: 500; padding: 7px 11px; border-radius: 999px; }
      .retry { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
      .retry button { padding: 7px 12px; font-size: 14px; }
      button:disabled { opacity: 0.6; }
      .scan { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; padding: 15px; }
      .scan svg { width: 22px; height: 22px; }
      .or { margin: 2px 0 -2px; text-align: center; color: var(--muted); font-size: 13px; }
      .card { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
      .card h2 { margin: 0; font-size: 19px; }
      .card p { margin: 0; }
      .status { color: var(--muted); font-size: 14px; }
      .setup { border-top: 1px solid var(--border); padding-top: 10px; }
      .setup ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
      .setup code { display: block; margin: 6px 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; user-select: all; }
      .setup .row { flex-wrap: wrap; }
      .detail { margin: 0; padding: 8px 10px; background: var(--bg); border-radius: 10px; font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
      details.remote { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 14px 18px; }
      details.remote > summary { cursor: pointer; font-weight: 600; font-size: 15px; }
      details.remote[open] > summary { margin-bottom: 12px; }
      details.remote form { padding: 0; border: 0; background: none; }
      #local { display: flex; flex-direction: column; gap: 10px; }
      #local h2 { margin: 0; font-size: 17px; }
      .link { background: none; color: var(--blue); padding: 0; font-weight: 500; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="mark.svg" alt="" />
        <h1>Orbis</h1>
        <p class="tagline" data-t="tagline"></p>
      </header>
      <details id="remote" class="remote">
      <summary data-t="remoteTitle"></summary>
      <form id="form" novalidate>
        <button type="button" id="scan" class="scan" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10" /></svg>
          <span data-t="scan"></span>
        </button>
        <p id="or" class="or" data-t="orType" hidden></p>
        <label for="address" data-t="label"></label>
        <div class="row">
          <input id="address" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://orbis-nome.tailnet.ts.net" />
          <button type="button" id="paste" class="secondary" data-t="paste"></button>
        </div>
        <div id="recent" class="recent" hidden></div>
        <label for="code"><span data-t="codeLabel"></span> <span class="optional" data-t="optional"></span></label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="483 219" />
        <p id="error" class="error" role="alert" hidden></p>
        <div id="retry" class="retry" hidden><span id="retry-text"></span><button type="button" id="retry-stop" class="secondary" data-t="stop"></button></div>
        <button type="submit" id="submit" data-t="connect"></button>
      </form>
      <div class="help">
        <span data-t="howTitle"></span>
        <ol>
          <li data-t="step1"></li>
          <li data-t="step2"></li>
          <li data-t="step3"></li>
        </ol>
      </div>
      </details>
      <details id="local-box" class="remote" hidden>
      <summary data-t="localBox"></summary>
      <section id="local" aria-labelledby="local-title">
        <h2 id="local-title" data-t="localTitle"></h2>
        <p class="help" data-t="localHelp"></p>
        <button type="button" id="local-start" data-t="localStart"></button>
        <p id="local-status" class="status" role="status" hidden></p>
        <p id="local-error" class="error" role="alert" hidden></p>
        <pre id="local-detail" class="detail" hidden></pre>
        <button type="button" id="local-stop" class="link" data-t="stopWaiting" hidden></button>
        <div id="local-permission" hidden>
          <p class="help" data-t="permissionHelp"></p>
          <button type="button" id="app-settings" class="secondary" data-t="appSettings"></button>
          <p class="help"><span data-t="permissionAlt"></span> <code>orbis-phone open</code></p>
          <div class="row"><button type="button" id="open-termux-alt" class="secondary" data-t="openTermux"></button></div>
        </div>
        <div id="local-setup" class="setup help" hidden>
          <strong data-t="setupTitle"></strong>
          <ol>
            <li><span data-t="setup1"></span><div class="row"><button type="button" id="get-termux" class="secondary" data-t="getTermux"></button></div></li>
            <li><span data-t="setup2"></span><code id="install-command"></code><div class="row"><button type="button" id="copy-command" class="secondary" data-t="copyCommand"></button><button type="button" id="open-termux" class="secondary" data-t="openTermux"></button></div></li>
            <li data-t="setup3"></li>
          </ol>
        </div>
      </section>
      </details>
      <p class="version" id="version"></p>
    </main>
    <script>
      const pt = {
        tagline: "Seus bots, no celular.",
        localTitle: "📱 Orbis neste celular",
        localHelp: "Seus bots rodam aqui mesmo, com o Claude Code: sem computador, sem servidor e sem login. Tudo fica guardado só neste celular.",
        localStart: "Abrir o Orbis",
        localStarting: "Ligando o Orbis…",
        localWaiting: "Ligando o Orbis no Termux… {n} s",
        localFirstTime: "A primeira vez depois de ligar o celular leva mais (até 2 minutos).",
        stopWaiting: "Parar de esperar",
        noTermux: "Falta o Termux, o programa onde o Orbis roda no celular.",
        noPermission: "O Orbis precisa da permissão “Executar comandos no ambiente do Termux”.",
        permissionHelp: "Toque em Permissões do app → Permissões adicionais (ou Outras permissões) → permita “Executar comandos no ambiente do Termux”. Depois, volte e toque em Abrir o Orbis.",
        appSettings: "Permissões do app",
        permissionAlt: "Não aparece a permissão? Sem ela também funciona: abra o Termux e rode",
        notInstalled: "O Orbis ainda não está instalado no Termux: faça o passo 2.",
        externalApps: "O Termux recusou o pedido do app: rode o comando do passo 2 de novo (ele libera o app).",
        timeout: "O Orbis não respondeu. Abra o Termux e rode orbis-phone serve para ver o que aconteceu.",
        stopped: "O Orbis no Termux parou:",
        setupTitle: "Primeira vez? Prepare o celular, uma vez só:",
        setup1: "Instale o Termux pelo F-Droid (a versão da Play Store não serve).",
        getTermux: "Baixar o Termux",
        setup2: "Abra o Termux, cole este comando e espere terminar (uns 10 minutos, com internet):",
        copyCommand: "Copiar comando",
        openTermux: "Abrir o Termux",
        setup3: "Volte aqui e toque em Abrir o Orbis. Quando o Android perguntar, permita que o Orbis use o Termux.",
        remoteTitle: "Conectar ao seu Orbis",
        label: "Endereço do seu Orbis",
        localBox: "Avançado: rodar o Orbis neste celular (Termux)",
        connect: "Conectar",
        howTitle: "Como conectar:",
        step1: "Deixe a <b>Tailscale</b> ligada neste celular (de preferência como VPN sempre ativa).",
        step2: "Digite o endereço do seu Orbis, como <code>https://orbis-nome.seu-tailnet.ts.net</code>, e toque em <b>Conectar</b>. Depois entre com o e-mail e a senha da sua conta.",
        step3: "Um Orbis num computador da mesma rede: abra <b>Configurações → Celular</b> nele e toque em <b>Ler QR code</b> aqui, ou digite o endereço (como <code>192.168.0.10</code>) e o código.",
        empty: "Digite o endereço do Orbis.",
        scheme: "Use um endereço http:// ou https://.",
        host: "Falta o computador no endereço.",
        invalid: "Isso não é um endereço válido.",
        failed: "O Orbis não respondeu em",
        version: "versão",
        paste: "Colar",
        pasteEmpty: "Não há um endereço copiado.",
        codeLabel: "Código de pareamento",
        optional: "(opcional)",
        connecting: "Conectando…",
        code: "Código errado, já usado ou vencido: gere outro no computador (Configurações → Celular).",
        busy: "Muitas tentativas: espere um minuto.",
        unreachable: "O Orbis não respondeu nesse endereço. O computador está ligado, na mesma rede, com o Orbis aberto pelo Orbis-Celular.bat?",
        http: "O Orbis respondeu com um erro ao código. Tente de novo.",
        cert: "o certificado desse endereço não é confiável para o celular. Use http:// na rede local ou um certificado válido.",
        retryIn: "Tentando de novo em {n} s…",
        stop: "Parar",
        scan: "Ler QR code",
        orType: "ou digite o endereço",
        scanUnavailable: "Este celular não tem o leitor de QR code do Google Play: digite o endereço e o código.",
        scanNotOrbis: "Esse QR code não é de um Orbis. No computador, abra Configurações → Celular e gere um código.",
      };
      const en = {
        tagline: "Your bots, on your phone.",
        localTitle: "📱 Orbis on this phone",
        localHelp: "Your bots run right here, with Claude Code: no computer, no server and no sign-in. Everything is kept on this phone only.",
        localStart: "Open Orbis",
        localStarting: "Starting Orbis…",
        localWaiting: "Starting Orbis in Termux… {n} s",
        localFirstTime: "The first time after the phone starts takes longer (up to 2 minutes).",
        stopWaiting: "Stop waiting",
        noTermux: "Termux is missing: the program Orbis runs in on the phone.",
        noPermission: "Orbis needs the permission “Run commands in Termux environment”.",
        permissionHelp: "Tap App permissions → Additional (or Other) permissions → allow “Run commands in Termux environment”. Then come back and tap Open Orbis.",
        appSettings: "App permissions",
        permissionAlt: "No permission to tap? It works without it: open Termux and run",
        notInstalled: "Orbis is not installed in Termux yet: do step 2.",
        externalApps: "Termux refused the app's request: run the command of step 2 again (it lets the app in).",
        timeout: "Orbis did not answer. Open Termux and run orbis-phone serve to see what happened.",
        stopped: "Orbis in Termux stopped:",
        setupTitle: "First time? Set the phone up, once:",
        setup1: "Install Termux from F-Droid (the Play Store version does not work).",
        getTermux: "Get Termux",
        setup2: "Open Termux, paste this command and wait for it to finish (about 10 minutes, online):",
        copyCommand: "Copy command",
        openTermux: "Open Termux",
        setup3: "Come back and tap Open Orbis. When Android asks, let Orbis use Termux.",
        remoteTitle: "Connect to your Orbis",
        label: "Address of your Orbis",
        localBox: "Advanced: run Orbis on this phone (Termux)",
        connect: "Connect",
        howTitle: "How to connect:",
        step1: "Keep <b>Tailscale</b> on on this phone (best as an always-on VPN).",
        step2: "Type your Orbis's address, like <code>https://orbis-name.your-tailnet.ts.net</code>, and tap <b>Connect</b>. Then sign in with your account's email and password.",
        step3: "An Orbis on a computer of the same network: open <b>Settings → Phone</b> there and tap <b>Scan QR code</b> here, or type its address (like <code>192.168.0.10</code>) and the code.",
        empty: "Type the address of Orbis.",
        scheme: "Use an http:// or https:// address.",
        host: "The address names no computer.",
        invalid: "That is not a valid address.",
        failed: "Orbis did not answer at",
        version: "version",
        paste: "Paste",
        pasteEmpty: "No address is copied.",
        codeLabel: "Pairing code",
        optional: "(optional)",
        connecting: "Connecting…",
        code: "Wrong, used or expired code: make another one on the computer (Settings → Phone).",
        busy: "Too many tries: wait a minute.",
        unreachable: "Orbis did not answer at that address. Is the computer on, on the same network, with Orbis started by Orbis-Celular.bat?",
        http: "Orbis answered the code with an error. Try again.",
        cert: "the phone does not trust that address's certificate. Use http:// on the local network, or a valid certificate.",
        retryIn: "Trying again in {n} s…",
        stop: "Stop",
        scan: "Scan QR code",
        orType: "or type the address",
        scanUnavailable: "This phone has no Google Play QR code scanner: type the address and the code.",
        scanNotOrbis: "That QR code is not from Orbis. On the computer, open Settings → Phone and make a code.",
      };
      const t = /^pt\b/i.test(navigator.language) ? pt : en;
      document.documentElement.lang = t === pt ? "pt-BR" : "en";
      for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = t[el.dataset.t];

      const params = new URLSearchParams(location.search);
      const input = document.getElementById("address");
      const codeInput = document.getElementById("code");
      const submit = document.getElementById("submit");
      const errorBox = document.getElementById("error");
      const show = (text) => {
        errorBox.textContent = text;
        errorBox.hidden = !text;
      };
      const hub = params.get("hub");
      if (hub) input.value = hub;
      if (params.get("cert")) show(`${params.get("error") || ""}: ${t.cert}`);
      else if (params.get("error")) show(`${t.failed} ${params.get("error")}`);
      document.getElementById("version").textContent = `Orbis Android · ${t.version} ${params.get("v") || ""}`;

      // The hubs used before, a tap away.
      let recent = [];
      try {
        recent = JSON.parse(params.get("recent") || "[]");
      } catch {
        recent = [];
      }
      const recentBox = document.getElementById("recent");
      for (const address of recent) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.textContent = address.replace(/^https?:\/\//, "").replace(/\/$/, "");
        chip.addEventListener("click", () => (input.value = address));
        recentBox.appendChild(chip);
      }
      recentBox.hidden = recent.length === 0;

      // Your Orbis on a server comes first (change 0077). Orbis on this phone (Termux) is an advanced choice,
      // closed below, that starts only when asked.
      const bridge = window.orbisAndroid;
      const hasLocal = !!(bridge && bridge.startLocal);
      const remote = document.getElementById("remote");
      remote.open = true;
      const localBox = document.getElementById("local-box");
      localBox.open = params.get("local") === "start";
      const el = (id) => document.getElementById(id);
      const localStart = el("local-start");
      const localStatus = el("local-status");
      const localError = el("local-error");
      const localDetail = el("local-detail");
      const localStop = el("local-stop");
      const panels = (state) => {
        el("local-setup").hidden = !["no-termux", "not-installed", "external-apps"].includes(state);
        el("local-permission").hidden = state !== "no-permission";
      };
      const idle = () => {
        localStart.disabled = false;
        localStart.textContent = t.localStart;
        localStatus.hidden = true;
        localStop.hidden = true;
      };
      const fail = (text, detail) => {
        idle();
        localError.textContent = text;
        localError.hidden = !text;
        localDetail.textContent = detail || "";
        localDetail.hidden = !detail;
      };
      if (hasLocal) {
        localBox.hidden = false;
        el("install-command").textContent = bridge.installCommand ? bridge.installCommand() : "";
        panels(bridge.localState ? bridge.localState() : "ready");
        localStart.addEventListener("click", () => {
          fail("", "");
          bridge.startLocal();
        });
        localStop.addEventListener("click", () => {
          if (bridge.stopWaiting) bridge.stopWaiting();
          idle();
        });
        el("copy-command").addEventListener("click", () => bridge.copyInstallCommand && bridge.copyInstallCommand());
        el("open-termux").addEventListener("click", () => bridge.openTermux && bridge.openTermux());
        el("get-termux").addEventListener("click", () => bridge.getTermux && bridge.getTermux());
        el("open-termux-alt").addEventListener("click", () => bridge.openTermux && bridge.openTermux());
        el("app-settings").addEventListener("click", () => bridge.openAppSettings && bridge.openAppSettings());
      }
      window.onLocal = (state, detail) => {
        if (state === "starting") {
          const seconds = Number(detail || 0);
          localStart.disabled = true;
          localStart.textContent = t.localStarting;
          localStatus.hidden = false;
          localStatus.textContent = t.localWaiting.replace("{n}", seconds) + (seconds >= 15 ? ` ${t.localFirstTime}` : "");
          localStop.hidden = false;
          localError.hidden = true;
          return;
        }
        panels(state);
        const text = { "no-termux": t.noTermux, "no-permission": t.noPermission, "not-installed": t.notInstalled, "external-apps": t.externalApps, timeout: t.timeout, stopped: t.stopped }[state] || state;
        fail(text, ["stopped", "timeout", "no-permission"].includes(state) ? detail : "");
      };

      // A link copied on the computer (as Orbis-Celular.bat prints it), from the phone's clipboard.
      document.getElementById("paste").addEventListener("click", () => {
        const text = window.orbisAndroid?.clipboardText ? window.orbisAndroid.clipboardText() : "";
        const link = /https?:\/\/\S+/i.exec(text || "");
        if (link) input.value = link[0];
        else show(t.pasteEmpty);
      });

      let retryTimer = null;
      const stopRetry = () => {
        clearInterval(retryTimer);
        retryTimer = null;
        document.getElementById("retry").hidden = true;
      };
      document.getElementById("retry-stop").addEventListener("click", stopRetry);

      const connect = () => {
        stopRetry();
        if (!window.orbisAndroid) return show(t.invalid);
        const why = window.orbisAndroid.connect(input.value, codeInput.value);
        if (why === "pending") {
          show("");
          submit.disabled = true;
          submit.textContent = t.connecting;
          return;
        }
        show(why ? t[why] || why : "");
      };
      // The answer to a pairing code that did not work.
      window.onConnectResult = (why) => {
        submit.disabled = false;
        submit.textContent = t.connect;
        show(t[why] || why);
      };
      // The computer's QR code, read by the phone's camera: its link holds the hub and the code (#pair=…).
      const scan = document.getElementById("scan");
      if (window.orbisAndroid?.scanQr) {
        scan.hidden = false;
        document.getElementById("or").hidden = false;
        scan.addEventListener("click", () => {
          show("");
          window.orbisAndroid.scanQr();
        });
      }
      window.onScanned = (text, why) => {
        if (why === "unavailable") return show(t.scanUnavailable);
        if (!text) return;
        const link = /https?:\/\/\S+/i.exec(text);
        const code = link && /#(?:[^#]*&)?pair=(\d{6})(?:&|$)/.exec(link[0]);
        if (!link || !(code || /#token=/.test(link[0]))) return show(t.scanNotOrbis);
        input.value = code ? link[0].split("#")[0] : link[0];
        codeInput.value = code ? code[1] : "";
        connect();
      };
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        connect();
      });

      // The saved hub did not answer (computer off, another network): try again by itself, every 10 s.
      if (hub && params.get("error") && !params.get("cert")) {
        let left = 10;
        const text = document.getElementById("retry-text");
        const tick = () => (text.textContent = t.retryIn.replace("{n}", left));
        tick();
        document.getElementById("retry").hidden = false;
        retryTimer = setInterval(() => {
          left -= 1;
          if (left > 0) return tick();
          stopRetry();
          if (input.value === hub && !codeInput.value) connect();
        }, 1000);
      }
      // The hub on this phone was lost while open: start it again right away.
      if (hasLocal && params.get("local") === "start") bridge.startLocal();
      else if (remote.open && !input.value) input.focus();
    </script>
  </body>
</html>
